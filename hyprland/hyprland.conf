############################
# Variables
############################

$mod = SUPER
$alt = ALT

############################
# Appearance
############################

general {
    border_size = 1
    col.active_border = rgb(bf616a)
    col.inactive_border = rgb(2f343f)
    gaps_out = 0
    gaps_in = 0
}

decoration {
    rounding = 0
    blur:enabled = false
    shadow:enabled = false
}


animation = workspaces, 0
animation = windows, 0
animation = fade, 0

# i3 font setting not directly supported globally in Hyprland
# Configure fonts in your bar (e.g. waybar) instead

############################
# Input
############################

# Use SUPER + mouse to drag floating windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

input{
    accel_profile = flat
    force_no_accel = true
}

############################
# Monitor
############################

monitor=DP-1,1920x1080@240,0x0,1
monitor=DP-2,1920x1080@240,0x0,1


############################
# Autostart
############################

exec-once = hyprpaprer
# TODO: is this needed?
exec-once = systemctl --user start elephant.service
exec-once = walker --gapplication-service

############################
# Applications
############################

bind = $mod, RETURN, exec, ghostty

# launcher
bind = $mod, D, exec, walker

# lock
bind = $mod, L, exec, hyprlock

bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

############################
# Audio (PipeWire recommended)
############################

# amixer (ALSA) works but wpctl is preferred for PipeWire
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

############################
# Window Management
############################

bind = $mod, Q, killactive

# Music control (mpc works unchanged)
bind = , XF86AudioNext, exec, mpc next
bind = , XF86AudioPrev, exec, mpc prev
bind = , XF86AudioPlay, exec, mpc toggle
bind = , XF86AudioStop, exec, mpc stop

# Focus movement
bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

# Move windows
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, RIGHT, movewindow, r
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, DOWN, movewindow, d

# Layouts
bind = $mod, H, layoutmsg, orientationleft
bind = $mod, V, layoutmsg, orientationtop

bind = $mod, F, fullscreen

# Toggle floating
bind = $mod, SPACE, togglefloating

############################
# Workspaces
############################

bind = $alt CTRL, RIGHT, workspace, e+1
bind = $alt CTRL, LEFT, workspace, e-1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6

############################
# Resize mode (Hyprland has no i3-style mode blocks)
# Use built-in resize dispatcher instead
############################

bind = $mod, R, submap, resize

submap = resize
bind = , LEFT, resizeactive, -20 0
bind = , RIGHT, resizeactive, 20 0
bind = , UP, resizeactive, 0 -20
bind = , DOWN, resizeactive, 0 20
bind = , RETURN, submap, reset
submap = reset

############################
# Bar (i3bar → Waybar recommended)
############################

# Hyprland does not provide a built-in bar.
# Replace i3bar + i3status with Waybar.

exec-once = waybar

############################
# Window Rules (Wayland uses app_id instead of X11 class)
############################

# You can inspect app_id using: hyprctl clients

# TODO: Deprecated
#windowrulev2 = workspace 1, class:^(kitty)$
#windowrulev2 = workspace 2, class:^(code)$
#windowrulev2 = workspace 3, class:^(brave.*)$

############################
# Restart Hyprland
############################

bind = $mod SHIFT, R, exec, hyprctl reload
