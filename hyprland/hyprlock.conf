# ============================
# Hyprlock Configuration
# ============================

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
}

# ============================
# Background
# ============================

background {
    monitor =
    path = ~/Pictures/wallpapers/mountain rocket take off.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.8
}

# Dark overlay for readability
shape {
    monitor =
    size = 100%, 100%
    color = rgba(2f343fcc)
    zindex = 0
}

# ============================
# Clock (centered)
# ============================

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(d8dee8ff)
    font_size = 64
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(d8dee8aa)
    font_size = 18
    font_family = Noto Sans
    position = 0, 70
    halign = center
    valign = center
}

# ============================
# Password Field
# ============================

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(4b5262ff)
    inner_color = rgba(2f343fff)
    font_color = rgba(d8dee8ff)

    fade_on_empty = false
    placeholder_text = <span foreground="##d8dee8aa">Enter Password</span>

    fail_color = rgba(bf616aff)
    check_color = rgba(88b090ff)

    rounding = 6
    position = 0, -40
    halign = center
    valign = center
}
